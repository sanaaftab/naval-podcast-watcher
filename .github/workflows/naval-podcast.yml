name: Naval Podcast Watcher

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub cron is best-effort, expect some drift)
  workflow_dispatch:          # lets you run it manually from the Actions tab

# Prevent overlapping runs from racing on the committed state file.
concurrency:
  group: naval-podcast
  cancel-in-progress: false

# Needed so the job can commit the updated state back to the repo.
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python watcher.py

      - name: Commit state
        if: always()   # commit heartbeat/state even if the check failed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update watcher state [skip ci]"
          git push
